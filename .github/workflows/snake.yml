name: Generate Snake

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: junaaid96
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_dots=%23ebedf0,%23e8c98f,%23c98a3d,%23B36B36,%237E4323&color_snake=%237E4323
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=%23161b22,%233a2a1a,%237E4323,%23B36B36,%23E8A33D&color_snake=%23E8A33D

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
